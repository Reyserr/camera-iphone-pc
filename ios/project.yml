# Description du projet Xcode, lue par XcodeGen sur le Mac de GitHub Actions.
# Le fichier .xcodeproj est généré automatiquement : on ne modifie que ce fichier.
name: CameraApp

options:
  bundleIdPrefix: com.reyserr
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CameraApp:
    type: application
    platform: iOS
    sources:
      - path: CameraApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reyserr.camera-iphone-pc
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CameraApp:
    build:
      targets:
        CameraApp: all
