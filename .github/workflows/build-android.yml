# Compile l'app Android LynxCam et fournit LynxCam.apk.
name: Build Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lynxcam.jks"
            echo "LYNXCAM_KEYSTORE=$RUNNER_TEMP/lynxcam.jks" >> "$GITHUB_ENV"
            echo "LYNXCAM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APK signé avec la clé LynxCam"
          else
            echo "::warning::Clé LynxCam non configurée : APK signé avec une clé de test (voir README)"
          fi

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Préparer LynxCam.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LynxCam.apk
          ls -lh LynxCam.apk

      - name: Publier LynxCam.apk
        uses: actions/upload-artifact@v4
        with:
          name: LynxCam-android
          path: LynxCam.apk
          retention-days: 30
