# Compile l'app iPhone LynxCam sur un Mac de GitHub et fournit le fichier LynxCam.ipa (non signé).
# Sideloadly le signe ensuite avec ton identifiant Apple au moment de l'installation.
name: Build iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compiler (sans signature)
        working-directory: ios
        run: |
          xcodebuild \
            -project CameraApp.xcodeproj \
            -scheme CameraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer le fichier .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CameraApp.app Payload/
          zip -qry LynxCam.ipa Payload
          ls -lh LynxCam.ipa

      - name: Publier le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LynxCam-ipa
          path: ios/LynxCam.ipa
          retention-days: 30
